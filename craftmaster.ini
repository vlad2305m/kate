;
; CraftMaster configuration for building KWrite for Android.
; Used by KDE Craft: https://invent.kde.org/packaging/craft
;
; Usage:
;   git clone https://invent.kde.org/packaging/craftmaster.git
;   python3 craftmaster/CraftMaster.py --config craftmaster.ini \
;       --setup --target android-arm64
;   python3 craftmaster/CraftMaster.py --config craftmaster.ini \
;       --target android-arm64 -- --install-deps kde/applications/kate
;   python3 craftmaster/CraftMaster.py --config craftmaster.ini \
;       --target android-arm64 -- kde/applications/kate

[Variables]
Root = /craft

[General]
Branch = master
ShallowClone = True

[BlueprintSettings]
; Use the development branch for kate itself (since we're building from source)
kde/applications/kate.version = master
kde/applications/kate.branch  = master

[android-arm64-GeneralSettings]
General/WorkRoot         = /craft/android-arm64
General/UseCache         = True
Packager/UseCache        = True
Compile/CompileType      = Release
CMake/BuildTests         = False
General/ABI              = android_arm64_v8a

[android-arm64]
QtAndroid/API_LEVEL = 34
QtAndroid/NDK_VERSION = r26c
